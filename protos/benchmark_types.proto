syntax = "proto3";
package kaggle.benchmarks;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

option csharp_namespace = "Kaggle.Sdk.Benchmarks";

message BenchmarkTaskVersion {
    // The ID of the BenchmarkTaskVersion from the DB. This would change
    // whenever the definition of the Benchmark changes (i.e. new notebook version or
    // promptfoo config update).
    optional int32 id = 1;
    // ID of the "container" BenchmarkTask
    optional int32 task_id = 2;
    // The semantic version number that increments from/by 1 as the definition changes
    optional int32 version_number = 3;
    // The user-provided name/description for the task
    string name = 4;
    optional string description = 5;
    // The code/configuration that defines the task
    string definition = 6;
    // TODO: added fields to track task-subtask relationship.
    // This field track the subtask file names.
    repeated string subtask_file_names = 7;
}

message BenchmarkTaskRun {
  // The unique identifier for the benchmark run.
  // Only one of these fields should be populated.
  oneof run_id {
    // The ID of the run from the database.
    // This is used for top-level runs that have been persisted.
    int32 id = 1;
    // The ID of the run as generated by the Python library.
    // This is used for:
    //  1. New top-level runs that have not yet been persisted to the database.
    //  2. Sub-task runs, which may not have a corresponding database ID.
    string py_run_id = 13;
  }
  // If included, indicates that this run was manually entered by this user id.
  optional int32 manual_user_id = 2;
  // The parent task version that was invoked. For create flows, only the ID
  // value is used.
  BenchmarkTaskVersion task_version = 3;
  // The benchmark model version that was evaluated against. For create flows,
  // only the ID value is used.
  // For the main Personal Benchmarks view, this will be useful to correlate with
  // the predetermined columns. For the Task detail view, this will help determine
  // the models to represent in the left sidebar.
  BenchmarkModelVersion model_version = 4;
  // The result of the run. NOTE: This is a field and proto that is serialized into/out
  // of JSON from the DB. It's currently used by Research Benchmarks. We'll leave this
  // untouched for Personal Benchmarks, where we'll use the "results" field. See the
  // BenchmarkTaskRuns section above for more info on schemas/deserialization.
  // BenchmarkResult result = 5;
  BenchmarkTaskRunState state = 6;
  google.protobuf.Timestamp start_time = 7;
  google.protobuf.Timestamp end_time = 8;
  // Conversations between various roles in LLM interactions. Nested within these
  // conversations is the content needed to build the 'output' section for various
  // visualizations.
  repeated Conversation conversations = 9;
  // This captures the aggregated results for the task (as well as any public/private
  // split results when applicable)
  repeated BenchmarkTaskRunResult results = 10;
  // If applicable, any assertions made during the run. Note that any tasks that
  // produce purely numerical values likely won't have assertions.
  repeated BenchmarkTaskRunAssertion assertions = 11;
  // Subtasks in a tree structure.
  repeated BenchmarkTaskRun subruns = 12;

  // 13 is used for py_run_id

  optional string error_message = 14; // details if the run errored out.

  // The user who triggered the creation of this run
  optional int32 creator_user_id = 15;
}

// The result of a BenchmarkTaskRun can either be binary (pass/fail) or continuous.
// NOTE: This proto is specifically for use by Personal Benchmarks for now and is
// distinct from the preexisting BenchmarkResult
message BenchmarkTaskRunResult {
  // See the enum below. This helps de-clutter the proto where we need to
  // account for public/private splits with their aggregate results.
  BenchmarkTaskRunResultType type = 1;
  oneof result {
    NumericResult numeric_result = 2;
    bool boolean_result = 3;
    google.protobuf.Struct dict_result = 4;
  }
}

message NumericResult {
  double value = 1;
  // Note, while we call this the "confidence interval" - the value we store
  // here is actually the "confidence radius", it should always be displayed as
  // a +- value.
  optional double confidence_interval = 2;
}

enum BenchmarkTaskRunResultType {
  // In practice, this could probably default to AGGREGATED since there's no
  // need to specify a type if there's only public results.
  BENCHMARK_TASK_RUN_RESULT_TYPE_UNSPECIFIED = 0;
  // For public/private split Tasks, this would be an aggregate of the 2 splits
  // Otherwise, this is analogous to PUBLIC
  AGGREGATED = 1;
  // The results just from the public split
  // For non-split Tasks, this is the same as AGGREGATED
  PUBLIC = 2;
  // The results just from the private split
  PRIVATE = 3;
}

enum BenchmarkTaskRunState {
  BENCHMARK_TASK_RUN_STATE_UNSPECIFIED = 0;
  BENCHMARK_TASK_RUN_STATE_QUEUED = 1;
  BENCHMARK_TASK_RUN_STATE_RUNNING = 2;
  BENCHMARK_TASK_RUN_STATE_COMPLETED = 3;
  BENCHMARK_TASK_RUN_STATE_ERRORED = 4;
}

message Conversation {
  // Conversation ID generated in Python
  string id = 1;
  // All requests made in this conversation
  repeated ModelRequest requests = 2;
  // If we want for convenience, this could be the aggregate of all the
  // requests.*.metrics for the Conversation
  ModelUsageMetrics metrics = 3;
  string model_version_slug = 4 [deprecated = true];
}

message ModelRequest {
  repeated Content contents = 1;
  ModelUsageMetrics metrics = 2;
  // Model request ID generated in Python
  string id = 3;
  // The model's own reasoning for the reply that closes this request, when the
  // provider returns it. A property of the turn rather than a Part, because
  // both providers hand back one blob per reply, and a Part variant would have
  // to be re-joined by every reader. Empty for streaming, which does not
  // capture reasoning yet.
  //
  // Not yet mirrored in kaggleazure's copy of this file. When it is added
  // there it must reuse field 4 -- a number means one thing forever.
  optional string reasoning_traces = 4;
}

// Trying to keep this aligned with Open Telemetry specs
message ModelUsageMetrics {
  int32 input_tokens = 1;
  int32 output_tokens = 2;
  optional int32 thinking_tokens = 3;
  int32 duration_ms = 4;
  optional int64 input_tokens_cost_nanodollars = 5;
  optional int64 output_tokens_cost_nanodollars = 6;
  optional int64 total_backend_latency_ms = 7;
}

message ConversationRequestIdentifier {
  string conversation_id = 1;
  string request_id = 2;
}

message BenchmarkTaskRunAssertion {
  // Expectation message shown as a summary of the assertion.
  string expectation = 1;
  BenchmarkTaskRunAssertionStatus status = 2;
  // Deprecated failure_message
  optional string failure_message = 3 [deprecated = true];
  int32 line_number = 4;
  string definition = 5;
  repeated ConversationRequestIdentifier conversation_request_ids = 6;
}

enum BenchmarkTaskRunAssertionStatus {
  BENCHMARK_TASK_RUN_ASSERTION_STATUS_UNSPECIFIED = 0;
  BENCHMARK_TASK_RUN_ASSERTION_STATUS_PASSED = 1;
  BENCHMARK_TASK_RUN_ASSERTION_STATUS_FAILED = 2;
  BENCHMARK_TASK_RUN_ASSERTION_STATUS_ERRORED = 3;
}


// Model used by the LLM Proxy to run as a benchmark
message BenchmarkModelVersion {
  // The id of the benchmark model version.
  int32 id = 1;
  // The id of the parent benchmark model.
  int32 benchmark_model_id = 2;
  // The slug of the model version. ex: "gemini-1.5-pro-001"
  // Required for CREATE, can be updated later.
  string slug = 3;
  // An external link to a resource explaining the model version. ex: blog post,
  // aistudio, etc.
  optional string external_url = 4;
  // A cutoff date for training data for the model.
  optional google.protobuf.Timestamp knowledge_cutoff = 5;
  // Whether this BenchmarkModelVersion is the default for the parent
  // BenchmarkModel.
  bool is_default = 6;
}

// Content and parts definition corresponding to genai concpets
// http://google3/third_party/py/google/genai/types.py

// Contains the multi-parts content of a message.
message Content {
    // List of parts that constitute a single message. Each part may have
    // a different IANA MIME type.
    repeated Part parts = 1;
    optional ContentRole role = 2;
    // The name of the message sender.
    optional string sender_name = 3;
}

enum ContentRole {
    CONTENT_ROLE_UNSPECIFIED = 0;
    // Inputs from the user.
    CONTENT_ROLE_USER = 1;
    // Responses from the assistant in a dialogue between user & assistant.
    CONTENT_ROLE_ASSISTANT = 2;
    // System instructions or commands ahead of the conversation. e.g.
    // "assistant should be polite and helpful". These are persistent (across
    // turns and queries) and immutable by developers and their end users.
    CONTENT_ROLE_SYSTEM = 3;
    // Developer instructions, i.e. "You are a chatbot for Uber.". These are
    // persistent (across turns and queries) but mutable by developers.
    // Equivalent of SYSTEM_1 in go/gemini-proto-roles.
    CONTENT_ROLE_DEVELOPER = 4;
    // Additional documents or information relevant to this conversation.
    CONTENT_ROLE_CONTEXT = 5;
}

message Part {
    // Ref: https://ai.google.dev/api/caching#Part
    oneof data {
        // Text
        string text = 1;
        // Inline bytes data
        Blob  inline_data = 2;
        // URI based data
        FileData file_data = 3;
    }
}

message Blob {
    // Display name of the blob. Used to provide a label or filename to distinguish blobs.
    // This field is not currently used in the Gemini GenerateContent calls.
    optional string display_name = 1;
    // Raw bytes from media formats.
    // A base64-encoded string in JSON (https://protobuf.dev/programming-guides/proto3/#json).
    optional bytes data = 2;
    // The IANA standard MIME type of the source data.
    optional string mime_type = 3;
}

message FileData {
    // Display name of the file data. Used to provide a label or filename to distinguish file data.
    // It is not currently used in the Gemini GenerateContent calls.
    optional string display_name = 1;
    // The URI of the file. This can be a general http/https URI or a GCS path.
    optional string file_uri = 2;
    // The IANA standard MIME type of the source data.
    optional string mime_type = 3;
}
