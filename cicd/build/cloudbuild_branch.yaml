steps:
  - id: "build-image"
    name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "--tag=${_IMAGE_REPO_NAME}/${_IMAGE_NAME}:${COMMIT_SHA}",
        "--tag=${_IMAGE_REPO_NAME}/${_IMAGE_NAME}:latest",
        "--file=${_DOCKERFILE_PATH}",
        ".",
      ]
    waitFor: ["-"]
    env:
      - "DOCKER_BUILDKIT=1"

  - id: "push-image"
    name: "gcr.io/cloud-builders/docker"
    args: ["push", "${_IMAGE_REPO_NAME}/${_IMAGE_NAME}", "--all-tags"]
    waitFor: ["build-image"]

  - id: test-3.11
    name: "${_IMAGE_REPO_NAME}/${_IMAGE_NAME}:${COMMIT_SHA}"
    dir: /benchmarks
    entrypoint: uv
    args: ["run", "--python", "3.11", "--group", "test", "pytest", "tests"]
    waitFor: ["push-image"]
    env:
      - "PLAYWRIGHT_BROWSERS_PATH=/root/.cache/ms-playwright"

  - id: test-3.12
    name: "${_IMAGE_REPO_NAME}/${_IMAGE_NAME}:${COMMIT_SHA}"
    dir: /benchmarks
    entrypoint: uv
    args: ["run", "--python", "3.12", "--group", "test", "pytest", "tests"]
    waitFor: ["push-image"]
    env:
      - "PLAYWRIGHT_BROWSERS_PATH=/root/.cache/ms-playwright"

  # Validates the converter's output against harbor's own models, which is the
  # only check that catches "we produced something harbor rejects". Its own step
  # because harbor is heavy, test-only, and cannot import on 3.11 -- so it is
  # never a kbench dependency, and the tests skip wherever it is absent.
  # Pinned: an ATIF schema bump must be an explicit, reviewed change.
  - id: harbor-validation-3.12
    name: "${_IMAGE_REPO_NAME}/${_IMAGE_NAME}:${COMMIT_SHA}"
    dir: /benchmarks
    entrypoint: uv
    args:
      [
        "run",
        "--python",
        "3.12",
        "--no-project",
        "--exclude-newer",
        "2026-09-03T00:00:00Z",
        "--with",
        "harbor==0.22.0",
        "--with",
        "pytest",
        "--with-editable",
        ".",
        "pytest",
        "tests/kaggle/test_atif.py",
        "-k",
        "harbor",
      ]
    waitFor: ["push-image"]

  - id: ruff
    name: "${_IMAGE_REPO_NAME}/${_IMAGE_NAME}:${COMMIT_SHA}"
    dir: /benchmarks
    entrypoint: uvx
    args: ["ruff@0.11.4", "check"]
    waitFor: ["push-image"]

images:
  - "${_IMAGE_REPO_NAME}/${_IMAGE_NAME}"

timeout: 3600s # 1 hour

substitutions:
  _IMAGE_REPO_NAME: gcr.io/kaggle-private-byod
  _IMAGE_NAME: personal-benchmarks-new-pr
  _DOCKERFILE_PATH: cicd/Dockerfile
