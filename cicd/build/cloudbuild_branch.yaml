steps:
  - id: "build-image"
    name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "--tag=${_IMAGE_REPO_NAME}/${_IMAGE_NAME}:${COMMIT_SHA}",
        "--tag=${_IMAGE_REPO_NAME}/${_IMAGE_NAME}:latest",
        "--file=${_DOCKERFILE_PATH}",
        ".",
      ]
    waitFor: ["-"]
    env:
      - "DOCKER_BUILDKIT=1"

  - id: "push-image"
    name: "gcr.io/cloud-builders/docker"
    args: ["push", "${_IMAGE_REPO_NAME}/${_IMAGE_NAME}", "--all-tags"]
    waitFor: ["build-image"]

  - id: test-3.11
    name: "${_IMAGE_REPO_NAME}/${_IMAGE_NAME}:${COMMIT_SHA}"
    dir: /benchmarks
    entrypoint: uv
    args: ["run", "--python", "3.11", "--group", "test", "pytest", "tests"]
    waitFor: ["push-image"]
    env:
      - "PLAYWRIGHT_BROWSERS_PATH=/root/.cache/ms-playwright"
      - "CI=true"

  - id: test-3.12
    name: "${_IMAGE_REPO_NAME}/${_IMAGE_NAME}:${COMMIT_SHA}"
    dir: /benchmarks
    entrypoint: uv
    args: ["run", "--python", "3.12", "--group", "test", "pytest", "tests"]
    waitFor: ["push-image"]
    env:
      - "PLAYWRIGHT_BROWSERS_PATH=/root/.cache/ms-playwright"
      - "CI=true"

  - id: ruff
    name: "${_IMAGE_REPO_NAME}/${_IMAGE_NAME}:${COMMIT_SHA}"
    dir: /benchmarks
    entrypoint: uvx
    args: ["ruff", "check"]
    waitFor: ["push-image"]

images:
  - "${_IMAGE_REPO_NAME}/${_IMAGE_NAME}"

timeout: 3600s # 1 hour

substitutions:
  _IMAGE_REPO_NAME: gcr.io/kaggle-private-byod
  _IMAGE_NAME: personal-benchmarks-new-pr
  _DOCKERFILE_PATH: cicd/Dockerfile
