steps:
  - id: "build-base"
    name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "${_REPO}/${_NAME}:latest", "-f", "cicd/Dockerfile.base", "."]
    waitFor: ["-"]
    env:
      - "DOCKER_BUILDKIT=1"

  - id: "push-base"
    name: "gcr.io/cloud-builders/docker"
    args: ["push", "${_REPO}/${_NAME}:latest"]
    waitFor: ["build-base"]


images:
  - "${_REPO}/${_NAME}"

timeout: 3600s

substitutions:
  _REPO: gcr.io/kaggle-private-byod
  _NAME: personal-benchmarks-base
