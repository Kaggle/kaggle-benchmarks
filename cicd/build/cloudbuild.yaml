steps:
  - id: "build-image-3.11"
    name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "--build-arg", "BASE_IMAGE_TAG=latest",
        "--tag=${_IMAGE_REPO_NAME}/${_IMAGE_NAME}:${COMMIT_SHA}",
        "--tag=${_IMAGE_REPO_NAME}/${_IMAGE_NAME}:python3.11",
        "--tag=${_IMAGE_REPO_NAME}/${_IMAGE_NAME}:latest",
        "--file=${_DOCKERFILE_PATH}",
        ".",
      ]
    waitFor: ["-"]
    env:
      - "DOCKER_BUILDKIT=1"

  - id: "build-image-3.12"
    name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "--build-arg", "BASE_IMAGE_TAG=python3.12",
        "--tag=${_IMAGE_REPO_NAME}/${_IMAGE_NAME}:${COMMIT_SHA}-python3.12",
        "--tag=${_IMAGE_REPO_NAME}/${_IMAGE_NAME}:python3.12",
        "--file=${_DOCKERFILE_PATH}",
        ".",
      ]
    waitFor: ["-"]
    env:
      - "DOCKER_BUILDKIT=1"

  - id: "push-image-3.11"
    name: "gcr.io/cloud-builders/docker"
    args: ["push", "${_IMAGE_REPO_NAME}/${_IMAGE_NAME}:${COMMIT_SHA}"]
    waitFor: ["build-image-3.11"]

  - id: "push-image-3.11-latest"
    name: "gcr.io/cloud-builders/docker"
    args: ["push", "${_IMAGE_REPO_NAME}/${_IMAGE_NAME}:latest"]
    waitFor: ["build-image-3.11"]

  - id: "push-image-3.12"
    name: "gcr.io/cloud-builders/docker"
    args: ["push", "${_IMAGE_REPO_NAME}/${_IMAGE_NAME}:${COMMIT_SHA}-python3.12"]
    waitFor: ["build-image-3.12"]

  - id: "push-image-3.12-tag"
    name: "gcr.io/cloud-builders/docker"
    args: ["push", "${_IMAGE_REPO_NAME}/${_IMAGE_NAME}:python3.12"]
    waitFor: ["build-image-3.12"]

images:
  - "${_IMAGE_REPO_NAME}/${_IMAGE_NAME}"

timeout: 3600s # 1 hour

substitutions:
  _IMAGE_REPO_NAME: gcr.io/kaggle-private-byod
  _IMAGE_NAME: personal-benchmarks-new
  _DOCKERFILE_PATH: cicd/Dockerfile
